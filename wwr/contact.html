<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Exciting Expeditions</title>
    <meta name="description" content="Contact page for Exciting Expeditions rafting company">
    <meta name="author" content="Angie Tatiana">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <header>
            <img src="images/logo.png" alt="Exciting Expeditions Logo">

            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="trips.html">Trips</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </nav>
        </header>

        <main>

            <!-- INFO -->
            <section class="contact-info">
                <h1>White Water Rafting Company</h1>
                <p>123 Main River Street</p>
                <p>Kolob, California</p>
                <p>+1 999 999 9999</p>
                <p>info@whitewater.com</p>
            </section>

            <!-- MAPA + FORM -->
            <section class="contact-grid">

                <!-- MAPA -->
                <div class="map">
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d4827.669433921637!2d-122.075094470038!3d38.26510538624574!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808516a5c765d525%3A0x34cf565b91bd9188!2sKolob%20Ct%2C%20Fairfield%2C%20CA%2094534%2C%20EE.%20UU.!5e0!3m2!1ses!2sco!4v1775948863956!5m2!1ses!2sco"
                      width="500" height="450" allowfullscreen="" loading="lazy"
                      referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>

                <!-- FORMULARIO -->
                <form class="contact-form">

                    <!-- NAME -->
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your name">
                    </div>

                    <!-- EMAIL -->
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email">
                    </div>

                    <!-- RADIO -->
                    <div class="form-group">
                        <label>Message Purpose</label>

                        <div class="radio-group">
                            <label for="general">
                                <input type="radio" id="general" name="purpose" value="general">
                                General Inquiry
                            </label>

                            <label for="reservation">
                                <input type="radio" id="reservation" name="purpose"
                                  value="reservation">
                                Reservation Question
                            </label>

                            <label for="suggestion">
                                <input type="radio" id="suggestion" name="purpose"
                                  value="suggestion">
                                Website Suggestion
                            </label>
                        </div>
                    </div>

                    <!-- MESSAGE -->
                    <div class="form-group full">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="Type here"></textarea>
                    </div>

                    <!-- CHECKBOX -->
                    <div class="form-group full checkbox">
                        <label for="subscribe">
                            <input type="checkbox" id="subscribe" name="subscribe">
                            Please subscribe me to the monthly newsletter
                        </label>
                    </div>

                    <!-- BUTTON -->
                    <div class="form-group full">
                        <button type="submit">Get in Touch!</button>
                    </div>

                </form>

            </section>

            <!-- EMPLEADOS -->
            <section class="employees">
                <h2>We Are Here to Serve You</h2>

                <div class="employee-grid">
                    <figure>
                        <img src="images/employee1.jpeg" alt="Employee">
                        <figcaption>Employee Profile</figcaption>
                    </figure>

                    <figure>
                        <img src="images/employee2.jpeg" alt="Employee">
                        <figcaption>Employee Profile</figcaption>
                    </figure>

                    <figure>
                        <img src="images/employee3.jpg" alt="Employee">
                        <figcaption>Employee Profile</figcaption>
                    </figure>
                </div>
            </section>

        </main>

        <!-- FOOTER -->
        <footer>
            <p>© 2026 🌊 Exciting Expeditions 🌊 Angie Rincon</p>

            <nav class="socialmedia">
                <a href="#"><img src="images/facebook.svg" alt="Facebook"></a>
                <a href="#"><img src="images/linkedin.svg" alt="LinkedIn"></a>
                <a href="#"><img src="images/instagram.svg" alt="Instagram"></a>
            </nav>
        </footer>

    </div>

</body>

</html>
